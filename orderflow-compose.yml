services:
  java_app:
    container_name: orderflow_app
    image: orderflow-java_app
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - java_db

  java_db:
    container_name: orderflow_container
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: orderflow
      POSTGRES_PASSWORD: TROUBADOR!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  jenkins:
    image: jenkins/jenkins:2.580
    container_name: jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
volumes:
  pgdata:
  jenkins_data: